[advisories]
version = 2
yanked = "deny"
# Every entry says why it doesn't apply and when to remove it.
# RUSTSEC-2026-0459 is also listed in .cargo/audit.toml; keep the two in step.
ignore = [
    { id = "RUSTSEC-2026-0459", reason = "Needs a database and -wal written by a less trusted party. We open only our own file in the data directory, and uploads are never opened as SQLite. Only restore backups you trust. Remove when sqlx allows libsqlite3-sys >= 0.39; sqlx-sqlite 0.9.0 caps it below 0.38." },
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained, not vulnerable: a compile-time proc macro pulled in by Leptos, with nothing of it in the shipped binary. Remove when Leptos drops it." },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# Crates in this workspace are not published and carry no licence field yet.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
