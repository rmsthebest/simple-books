# Runs scripts/check.sh, the real-kepubify test, and a Docker build, on every push
# and pull request. Actions are pinned by commit; the comment is the release.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The runner has about 14 GB free, and full debug info for every test
  # binary and target check.sh builds is more than that. Line tables keep
  # backtraces' files and lines; incremental builds only help locally.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: "0"
  KEPUBIFY_VERSION: "5.0.0"
  KEPUBIFY_SHA256: cb77fe364f780feea8de4586600f7160c7516586c21d9a80b1504c6630389069

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Toolchains the runner comes with that nothing here uses, for room.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
          rustup default 1.99.1
          rustup target add wasm32-unknown-unknown armv7-unknown-linux-musleabihf

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          # v2: built with line tables only, so the full-debug caches before
          # it aren't restored.
          key: check-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: check-v2-${{ runner.os }}-

      - name: Tools
        run: |
          command -v cargo-deny || cargo install --locked cargo-deny@0.20.2
          command -v cargo-audit || cargo install --locked cargo-audit@0.22.2
          command -v sqlx || cargo install --locked sqlx-cli@0.9.0 --no-default-features --features sqlite

      - name: kepubify, for the real conversion test
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kepubify" \
            "https://github.com/pgaskin/kepubify/releases/download/v${KEPUBIFY_VERSION}/kepubify-linux-64bit"
          echo "${KEPUBIFY_SHA256}  $RUNNER_TEMP/kepubify" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/kepubify"
          echo "KEPUBIFY_TEST_PATH=$RUNNER_TEMP/kepubify" >> "$GITHUB_ENV"

      - run: scripts/check.sh

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
