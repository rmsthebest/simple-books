[package]
name = "dictionary"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The reader's English–Swedish dictionary: its file format, word lookup, and the converter from Folkets lexikon's XML."
publish = false

[lints]
workspace = true

[features]
# The converter, for the build: not on the device.
convert = ["dep:quick-xml", "dep:flate2"]

[dependencies]
flate2 = { version = "1", optional = true, default-features = false, features = ["zlib-rs"] }
quick-xml = { version = "0.42", optional = true }

[[bin]]
name = "build-dictionary"
required-features = ["convert"]
