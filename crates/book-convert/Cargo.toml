[package]
name = "book-convert"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Turns an EPUB into the simple-books book format. No filesystem, database or async access."
publish = false

[lints]
workspace = true

[dependencies]
book-format = { path = "../book-format" }
epub = { path = "../epub" }
hypher = "0.1.8"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
quick-xml = { version = "0.42", features = ["escape-html"] }
thiserror = "2"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
proptest = "1"
zip = { version = "9.5.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
