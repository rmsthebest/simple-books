[package]
name = "reader-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Lays out, paginates and draws simple-books books into an 8-bit gray page. No device code."
publish = false

[lints]
workspace = true

[dependencies]
book-format = { path = "../book-format" }
# Pure Rust: decodes the PNGs and JPEGs the server already made gray and screen-sized.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
# Bundled fonts only, so a static musl build never looks for fontconfig.
parley = { version = "0.12", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
# The version Parley uses, so its font data and coordinates are the same types.
skrifa = "0.44"
thiserror = "2"
zeno = "0.3.3"

[dev-dependencies]
book-convert = { path = "../book-convert" }
tempfile = "3"
