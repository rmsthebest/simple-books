[package]
name = "book-format"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The small book format the server makes from EPUBs and the simple-books reader draws."
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "9.5.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
