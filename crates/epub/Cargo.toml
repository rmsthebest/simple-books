[package]
name = "epub"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure, limit-enforcing EPUB parsing. No filesystem, database or async access."
publish = false

[lints]
workspace = true

[dependencies]
quick-xml = "0.42"
thiserror = "2"
zip = { version = "9.5.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
proptest = "1"
