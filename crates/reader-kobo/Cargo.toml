[package]
name = "reader-kobo"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The simple-books reader on the Kobo Clara BW: its screen, touch panel, buttons, light and sleep."
publish = false

[lints]
workspace = true

[dependencies]
# The local time zone, for the time in the status: /etc/localtime.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
book-format = { path = "../book-format" }
libc = "0.2"
reader-app = { path = "../reader-app" }
reader-core = { path = "../reader-core" }
