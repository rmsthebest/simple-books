[package]
name = "reader-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The simple-books reader app without device code: what taps, buttons and time do, and what goes on the screen."
publish = false

[lints]
workspace = true

[dependencies]
book-format = { path = "../book-format" }
reader-core = { path = "../reader-core" }
reader-sync = { path = "../reader-sync" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
sync-proto = { path = "../sync-proto" }
# To make cover images for tests.
image = { version = "0.25.10", default-features = false, features = ["png"] }
