[workspace]
members = [".", "crates/book-convert", "crates/book-format", "crates/dictionary", "crates/epub", "crates/kobo-conf", "crates/kobo-files", "crates/kobo-plugin", "crates/kobo-ssh", "crates/reader-app", "crates/reader-core", "crates/reader-emu", "crates/reader-kobo", "crates/reader-sync", "crates/sync-proto"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
repository = "https://github.com/rmsthebest/simple-books"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_possible_truncation = "allow"

[package]
name = "simple-books"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A minimal self-hosted ebook server with Kobo sync"
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "simple-books"
path = "src/main.rs"
required-features = ["ssr"]

[dependencies]
book-convert = { path = "crates/book-convert", optional = true }
book-format = { path = "crates/book-format", optional = true }
epub = { path = "crates/epub", optional = true }
sync-proto = { path = "crates/sync-proto", optional = true }
leptos = { version = "=0.8.23", features = ["islands"] }
leptos_meta = "0.8"
leptos_router = "0.8"
serde = { version = "1", features = ["derive"] }

# Client-only (the WASM islands).
console_error_panic_hook = { version = "0.1", optional = true }
js-sys = { version = "0.3", optional = true }
kobo-conf = { path = "crates/kobo-conf", optional = true }
# Both: the server writes the Kobo files' tar, the installer reads it.
kobo-files = { path = "crates/kobo-files", optional = true }
serde_json = { version = "1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Blob", "BlobPropertyBag", "console", "DataTransfer", "Document", "DomStringList", "DragEvent", "Element",
    "Event", "EventTarget", "File", "FileList", "FormData", "HtmlFormElement", "HtmlInputElement",
    "HtmlTextAreaElement", "Location", "Node", "NodeList", "ProgressEvent",
    "Url", "Window", "XmlHttpRequest", "XmlHttpRequestEventTarget", "XmlHttpRequestUpload",
] }

# Server-only.
axum = { version = "0.8.9", features = ["macros", "multipart"], optional = true }
base64 = { version = "0.22", optional = true }
bytes = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
hex = { version = "0.4", optional = true }
leptos_axum = { version = "0.8.10", optional = true }
rand = { version = "0.9", optional = true }
# Hardcover's API. rustls with the system's certificates, which the image has.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "http2"], optional = true }
sha2 = { version = "0.10", optional = true }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"], optional = true }
thiserror = { version = "2", optional = true }
time = { version = "0.3", features = ["formatting", "macros"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "process", "sync", "io-util", "time"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tower-http = { version = "0.6", features = ["catch-panic", "fs", "limit", "set-header", "trace"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
uuid = { version = "1", features = ["v4", "v5", "serde"], optional = true }
argon2 = { version = "0.6", optional = true }
rustix = { version = "1.1.6", features = ["fs", "process", "thread"], optional = true }
landlock = { version = "0.4.7", optional = true }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"], optional = true }

[dev-dependencies]
reader-app = { path = "crates/reader-app" }
reader-core = { path = "crates/reader-core" }
reader-sync = { path = "crates/reader-sync" }
futures-util = { version = "0.3.34", default-features = false }
proptest = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = "0.3"
zip = { version = "9.5.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[[test]]
name = "kobo_flow"
required-features = ["ssr"]

[[test]]
name = "kobo_convergence"
required-features = ["ssr"]

[[test]]
name = "log_leak"
required-features = ["ssr"]

[[test]]
name = "web"
required-features = ["ssr"]

[[test]]
name = "reader_sync"
required-features = ["ssr"]

[[test]]
name = "reader_update"
required-features = ["ssr"]

[[test]]
name = "reader_client"
required-features = ["ssr"]

[[test]]
name = "kobo_install"
required-features = ["ssr"]

[[test]]
name = "reader_app"
required-features = ["ssr"]

[features]
default = []
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:js-sys",
    "dep:kobo-conf",
    "dep:kobo-files",
    "dep:serde_json",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:argon2",
    "dep:axum",
    "dep:base64",
    "dep:book-convert",
    "dep:book-format",
    "dep:bytes",
    "dep:clap",
    "dep:epub",
    "dep:hex",
    "dep:image",
    "dep:kobo-files",
    "dep:landlock",
    "dep:leptos_axum",
    "dep:rand",
    "dep:reqwest",
    "dep:rustix",
    "dep:serde_json",
    "dep:sha2",
    "dep:sqlx",
    "dep:sync-proto",
    "dep:thiserror",
    "dep:time",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:uuid",
]

# Argon2 is too slow unoptimised for the tests that log in.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
panic = "unwind" # CatchPanicLayer must be able to turn a panic into a JSON response.

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
panic = "abort"
strip = true

[package.metadata.leptos]
output-name = "simple-books"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"

[[test]]
name = "hardcover"
required-features = ["ssr"]
